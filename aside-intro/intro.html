<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Aside Intro</title>
<link rel="stylesheet" href="fonts/nanum-gothic-800.css">
<style>
  :root {
    --red: #E50914;
    --black: #111111;
    --white: #F9FBFB; /* aside.png 배경색과 동일 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--white); }
  body { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; color: var(--black); }

  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--white); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .red { color: var(--red); }
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; letter-spacing: -0.02em; }

  /* 1. 이 브라우저는 미쳤습니다 */
  #s1 .bg { position: absolute; inset: 0; background: url(aside.png) center / cover no-repeat; }
  #s1 .line { bottom: 90px; font-size: 104px; }
  #s1 .a { display: inline-block; margin-right: 0.35em; }
  #s1 .crazy { display: inline-block; font-size: 150px; }

  /* 2. 인터넷에서 하는 모든 일들 / 대신 해줍니다 */
  #s2 .l1 { top: 360px; font-size: 110px; }
  #s2 .l2 { top: 540px; font-size: 130px; }

  /* 3. 이 브라우저한테 총 4가지 일을 시킬 건데요 */
  #s3 .l1 { top: 340px; font-size: 100px; }
  #s3 .l2 { top: 510px; font-size: 130px; }

  /* 4. 마지막은 진짜 충격적입니다 */
  #s4 .l1 { top: 300px; font-size: 110px; }
  #s4 .l2 { top: 470px; font-size: 200px; }

  /* 5. 1~4단계 */
  #s5 .dots { position: absolute; top: 110px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; }
  #s5 .dot { width: 120px; height: 14px; border-radius: 7px; background: #dcdfe0; }
  #s5 .dot.on { background: var(--black); }
  #s5 .dot.on.last { background: var(--red); }
  #s5 .step { position: absolute; top: 250px; left: 0; right: 0; text-align: center; font-size: 220px; opacity: 0; }
  #s5 .q { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-size: 230px; opacity: 0; }
  /* 단계 아래 y≈560~900 영역은 할 일 텍스트를 직접 넣을 수 있도록 비워둠 */
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1">
    <div class="bg"></div>
    <div class="line"><span class="a">이 브라우저는 </span><span class="crazy red">미쳤습니다</span></div>
  </div>
  <div class="scene" id="s2">
    <div class="line l1">인터넷에서 하는 모든 일들</div>
    <div class="line l2">대신 해줍니다.</div>
  </div>
  <div class="scene" id="s3">
    <div class="line l1">이 브라우저한테</div>
    <div class="line l2">총 4가지 일을 시킬 건데요</div>
  </div>
  <div class="scene" id="s4">
    <div class="line l1">마지막은 진짜</div>
    <div class="line l2 red">충격적입니다</div>
  </div>
  <div class="scene" id="s5">
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot last"></div></div>
    <div class="step" data-i="0">1단계</div>
    <div class="step" data-i="1">2단계</div>
    <div class="step" data-i="2">3단계</div>
    <div class="step" data-i="3">4단계</div>
    <div class="q red">???</div>
  </div>
</div>

<script>
// 타임라인(초). 녹음에 맞춰 숫자만 바꾸면 됩니다. sfx.py의 타이밍도 같이 맞추세요.
const T = {
  s1: [0.0, 2.2],  s1Crazy: 0.75,
  s2: [2.2, 4.4],  s2L2: 2.85,
  s3: [4.4, 6.2],  s3L2: 4.95,
  s4: [6.2, 7.8],  s4Shock: 6.8,
  s5: [7.8, 10.0], steps: [7.8, 8.3, 8.75, 9.15],
  end: 10.0,
};

const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeOutBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// 결정적(deterministic) 화면 흔들림
function shake(t, start, amp, dur = 0.45) {
  const k = prog(t, start, dur);
  if (k <= 0 || k >= 1) return [0, 0];
  const a = amp * Math.pow(1 - k, 2);
  return [a * Math.sin(t * 97.3) * Math.cos(t * 41.1), a * Math.sin(t * 73.7 + 1.3)];
}
function sceneAlpha(t, [a, b], fadeIn = 0.08, fadeOut = 0.08) {
  if (t < a || t >= b) return 0;
  return Math.min(a === 0 ? 1 : prog(t, a, fadeIn), b === T.end ? 1 : 1 - prog(t, b - fadeOut, fadeOut));
}
// 아래에서 올라오며 등장
function slideIn(el, t, start, dist = 60, dur = 0.35) {
  const k = easeOut(prog(t, start, dur));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - k) * dist}px)`;
}
// 크게 시작해서 쾅 박히는 등장
function slam(el, t, start, from = 2.4, dur = 0.22) {
  const k = prog(t, start, dur);
  el.style.opacity = t < start ? 0 : clamp(k * 3);
  const s = from + (1 - from) * easeOut(k);
  el.style.transform = `scale(${s})`;
}

function render(t) {
  // 1
  const s1 = $('#s1');
  s1.style.opacity = sceneAlpha(t, T.s1);
  $('#s1 .bg').style.transform = `scale(${1 + 0.06 * prog(t, T.s1[0], T.s1[1] - T.s1[0])})`;
  slideIn($('#s1 .a'), t, 0.15);
  slam($('#s1 .crazy'), t, T.s1Crazy);
  let [x, y] = shake(t, T.s1Crazy + 0.18, 26);
  s1.style.transform = `translate(${x}px, ${y}px)`;

  // 2
  $('#s2').style.opacity = sceneAlpha(t, T.s2);
  slideIn($('#s2 .l1'), t, T.s2[0] + 0.05);
  slideIn($('#s2 .l2'), t, T.s2L2);

  // 3
  $('#s3').style.opacity = sceneAlpha(t, T.s3);
  slideIn($('#s3 .l1'), t, T.s3[0] + 0.05);
  slideIn($('#s3 .l2'), t, T.s3L2);

  // 4
  const s4 = $('#s4');
  s4.style.opacity = sceneAlpha(t, T.s4);
  slideIn($('#s4 .l1'), t, T.s4[0] + 0.05);
  slam($('#s4 .l2'), t, T.s4Shock, 3.0);
  [x, y] = shake(t, T.s4Shock + 0.18, 40, 0.6);
  s4.style.transform = `translate(${x}px, ${y}px)`;

  // 5: 단계마다 점점 세게
  const s5 = $('#s5');
  s5.style.opacity = sceneAlpha(t, T.s5, 0.04);
  let cur = -1;
  T.steps.forEach((st, i) => { if (t >= st) cur = i; });
  document.querySelectorAll('#s5 .dot').forEach((d, i) => d.classList.toggle('on', i <= cur));
  document.querySelectorAll('#s5 .step').forEach((el, i) => {
    if (i !== cur) { el.style.opacity = 0; return; }
    const k = prog(t, T.steps[i], 0.18);
    const from = 1.5 + i * 0.35;          // 뒤로 갈수록 더 크게 박힘
    el.style.opacity = clamp(k * 3);
    el.style.transform = `scale(${from + (1 - from) * easeOut(k)})`;
    el.style.color = i === 3 ? 'var(--red)' : 'var(--black)';
  });
  const q = $('#s5 .q');
  const qs = T.steps[3] + 0.12;
  q.style.opacity = t < qs ? 0 : 1;
  // ??? 는 박힌 뒤 심장박동처럼 계속 뛰게
  const beat = t < qs + 0.2 ? easeOutBack(prog(t, qs, 0.2)) * 1 : 1 + 0.05 * Math.pow(Math.sin((t - qs) * Math.PI * 2.4), 8);
  q.style.transform = `scale(${t < qs + 0.2 ? 0.3 + 0.7 * beat : beat})`;
  const amp = cur < 0 ? 0 : 10 + cur * 14;
  [x, y] = shake(t, T.steps[Math.max(cur, 0)] + 0.1, amp, 0.35);
  s5.style.transform = `translate(${x}px, ${y}px)`;
}

window.render = render;
window.DURATION = T.end;

// 브라우저에서 열면 그냥 재생(미리보기). 렌더 시에는 ?render 로 열어 정지 상태에서 프레임 단위로 그림.
if (!location.search.includes('render')) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = (now) => { render(((now - t0) / 1000) % T.end); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else {
  render(0);
}
</script>
</body>
</html>
