<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Aside Intro</title>
<link rel="stylesheet" href="fonts/nanum-gothic-800.css">
<link rel="stylesheet" href="fonts/black-han-sans.css">
<style>
  :root {
    --red: #FF1E2D;
    --white: #FFFFFF;
    --bg: #050505;
    --cream: #F5F0E6;
    --ink: #1A1A1A;
    --marker: #FFD43B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; color: var(--white); }
  .bh { font-family: 'Black Han Sans', sans-serif; font-weight: 400; }
  .red { color: var(--red); }

  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; letter-spacing: -0.02em; opacity: 0; }
  .logo { position: absolute; left: 50%; background: url(aside.png) center / contain no-repeat; filter: invert(1); mix-blend-mode: lighten; }

  /* 0. 탭 지옥 → 유리처럼 박살 */
  #s0 canvas { position: absolute; inset: 0; }
  #s0 .cur { position: absolute; width: 46px; height: 46px; }
  #cap { position: absolute; left: 0; right: 0; top: 462px; text-align: center; opacity: 0; visibility: hidden; }
  #cap span { display: inline-block; font-size: 92px; padding: 6px 34px 14px; border-radius: 16px; background: rgba(0,0,0,0.88); }

  /* 1. 이 브라우저는 미쳤습니다 */
  #s1 .logo { width: 760px; height: 400px; top: 70px; margin-left: -380px; }
  #s1 .l2 { top: 560px; font-size: 330px; line-height: 1.1; }

  /* 2. 몽타주 (Aside 실제 녹화 화면으로 바꿔 넣을 자리) */
  #wall { position: absolute; left: 50%; top: 50%; width: 1912px; height: 1112px; margin: -556px 0 0 -956px;
          display: grid; grid-template-columns: repeat(4, 460px); grid-auto-rows: 260px; gap: 24px; }
  .win { background: #121316; border: 2px solid #26282d; border-radius: 16px; overflow: hidden; position: relative; opacity: 0; }
  .win .bar { height: 40px; background: #1b1d21; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .win .dot { width: 12px; height: 12px; border-radius: 6px; background: #3a3d44; }
  .win .url { margin-left: 10px; flex: 1; height: 24px; border-radius: 12px; background: #0c0d0f; font-size: 15px; line-height: 24px; padding: 0 12px; color: #9aa0a8; }
  .win .task { position: absolute; left: 22px; top: 62px; font-size: 34px; }
  .win .sk { position: absolute; left: 22px; height: 12px; border-radius: 6px; background: #24272c; }
  .win .prog { position: absolute; left: 22px; right: 22px; bottom: 54px; height: 10px; border-radius: 5px; background: #24272c; overflow: hidden; }
  .win .prog i { display: block; height: 100%; width: 0; background: var(--red); }
  .win.done .prog i { background: #fff; }
  .win .st { position: absolute; left: 22px; bottom: 16px; font-size: 22px; color: #9aa0a8; }
  .win.done .st { color: #fff; }
  .win .cur { position: absolute; width: 34px; height: 34px; }
  #s2 .band { position: absolute; left: 0; right: 0; top: 300px; height: 500px;
              background: linear-gradient(transparent, rgba(0,0,0,0.88) 22%, rgba(0,0,0,0.88) 78%, transparent); }
  #s2 .a { top: 345px; font-size: 88px; }
  #s2 .b { top: 445px; font-size: 270px; line-height: 1.1; }
  #s2 .c { top: 420px; font-size: 200px; line-height: 1.2; }
  #s2 .hl { background: var(--red); padding: 0 24px; border-radius: 12px; }

  /* 3. 이 브라우저한테 총 4가지 일을 시킬 건데요 */
  #floor { position: absolute; left: -50%; right: -50%; top: 540px; height: 1400px; transform-origin: top;
           background-image: linear-gradient(rgba(255,255,255,0.14) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.14) 2px, transparent 2px);
           background-size: 120px 120px; }
  #s3 .top { top: 90px; font-size: 86px; }
  #s3 .num { top: 150px; font-size: 640px; line-height: 1.05; }
  #s3 .bottom { top: 880px; font-size: 100px; }

  /* 4. 마지막은 진짜 충격적입니다 */
  #s4 .m1 { top: 330px; font-size: 110px; }
  #s4 .m2 { top: 470px; font-size: 230px; line-height: 1.1; }
  #s4 .shock { top: 360px; font-size: 300px; line-height: 1.1; }
  #pulse { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.92) 100%); opacity: 0; }

  /* 5. 세로 4분할: 1~4단계 (slot 칸에 직접 영상/글을 넣으면 됨) */
  #s5 .col { position: absolute; top: 0; width: 480px; height: 1080px; background: #0a0a0b; }
  #s5 .lab { position: absolute; top: 50px; left: 0; right: 0; text-align: center; font-size: 120px; line-height: 1.1; }
  #s5 .slot { position: absolute; top: 230px; left: 30px; right: 30px; bottom: 130px; border-radius: 20px;
              border: 3px solid rgba(255,255,255,0.12); background: #111214; }
  #s5 .col.last .lab { color: var(--red); }
  #s5 .col.last .slot { border-color: var(--red); }
  #s5 .q { position: absolute; left: 0; right: 0; top: 50%; margin-top: -150px; text-align: center; font-size: 250px; line-height: 1.2; color: var(--red); }
  #s5 .warn { position: absolute; bottom: 45px; left: 0; right: 0; text-align: center; font-size: 46px; opacity: 0; }
  #s5 .vline { position: absolute; top: 0; width: 5px; height: 1080px; background: #2a2b2f; }

  /* 6. 텐션 다운: 브이로그 톤 */
  #s6 { background: var(--cream); color: var(--ink); }
  #s6 .v1 { top: 300px; font-size: 92px; color: #6b6660; }
  #s6 .v2 { top: 450px; font-size: 118px; }
  #s6 .v3 { top: 610px; font-size: 150px; }
  #s6 .mk { background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 78% / 0% 38%; padding: 0 10px; }

  /* 오버레이 */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.09; mix-blend-mode: screen; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1">
    <div class="logo"></div>
    <div class="line l2 bh red">미쳤습니다</div>
  </div>

  <div class="scene" id="s0">
    <canvas id="hell" width="1920" height="1080"></canvas>
    <svg class="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#000" stroke-width="1.4"/></svg>
  </div>

  <div class="scene" id="s2">
    <div id="wall"></div>
    <div class="band"></div>
    <div class="line a">인터넷에서 하는</div>
    <div class="line b bh">모든 일</div>
    <div class="line c bh">전부 <span class="hl">대신</span> 해줍니다</div>
  </div>

  <div class="scene" id="s3">
    <div id="floor"></div>
    <div class="line top">이 브라우저한테</div>
    <div class="line num bh">1</div>
    <div class="line num bh">2</div>
    <div class="line num bh">3</div>
    <div class="line num bh red">4</div>
    <div class="line bottom">총 <span class="red">4가지</span> 일을 시킬 건데요</div>
  </div>

  <div class="scene" id="s4">
    <div id="pulse"></div>
    <div class="line m1">마지막은</div>
    <div class="line m2 bh">진짜</div>
    <div class="line shock bh red">충격적입니다</div>
  </div>

  <div class="scene" id="s5">
    <div class="col" style="left: 0"><div class="lab bh">1단계</div><div class="slot"></div></div>
    <div class="col" style="left: 480px"><div class="lab bh">2단계</div><div class="slot"></div></div>
    <div class="col" style="left: 960px"><div class="lab bh">3단계</div><div class="slot"></div></div>
    <div class="col last" style="left: 1440px"><div class="lab bh">4단계</div><div class="slot"><div class="q bh">???</div></div><div class="warn">끝까지 보세요</div></div>
    <div class="vline" style="left: 478px"></div>
    <div class="vline" style="left: 958px"></div>
    <div class="vline" style="left: 1438px"></div>
  </div>

  <div class="scene" id="s6">
    <div class="line v1">근데 사실…</div>
    <div class="line v2">처음엔 저도 적응하느라</div>
    <div class="line v3"><span class="mk">애먹었습니다</span></div>
  </div>

  <div id="cap"><span>이 브라우저는</span></div>
</div>
<div id="flash"></div>
<canvas id="grain" width="384" height="216"></canvas>
<div id="vig"></div>

<script>
// 타임라인(초). 녹음에 맞춰 숫자만 바꾸면 됩니다. sfx.py 의 T 도 같이 맞추세요.
const T = {
  s0: [0.0, 2.0],    crack: 1.15, fly: 1.25,
  cap: [0.2, 2.6],
  s1: [1.15, 2.6],   crazy: 1.3,
  s2: [2.6, 5.3],    s2B: 3.0, s2C: 3.85,
  s3: [5.3, 7.3],    nums: [5.6, 5.8, 6.0, 6.2], s3Bottom: 6.5,
  s4: [7.3, 9.6],    s4M2: 7.8, shock: 8.45,
  s5: [9.6, 13.0],   cols: [9.65, 10.0, 10.35, 10.7], warn: 11.4,
  freeze: [12.6, 13.0],   // 레코드 끼익 + 화면 멈춤
  s6: [13.0, 16.5],  v1: 13.15, v2: 13.9, v3: 14.5,
  end: 16.5,
};
const FLASH = [[T.crack, 0.5], [T.crazy, 0.8], [T.s2B, 0.4], [T.s2C, 0.4], [T.shock, 1]];
const SHAKE = [[T.crack, 16, 0.25], [T.crazy, 30, 0.5], [T.s2B, 14, 0.3], [T.s2C, 18, 0.35], [T.shock, 30, 0.6]];
const PUNCH = [[T.crazy, 0.08], [T.s2C, 0.05], [T.shock, 0.07]];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeOutBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const inRange = (t, [a, b]) => t >= a && t < b;
const decay = (t, at, dur) => (t < at || t > at + dur ? 0 : Math.pow(1 - (t - at) / dur, 2));

function slam(el, t, at, from = 2.6, dur = 0.2) {
  if (t < at) { el.style.opacity = 0; return; }
  const k = prog(t, at, dur);
  el.style.opacity = clamp(k * 4);
  el.style.transform = `scale(${from + (1 - from) * easeOut(k)})`;
}
function rise(el, t, at, dist = 50, dur = 0.25) {
  if (t < at) { el.style.opacity = 0; return; }
  const k = easeOut(prog(t, at, dur));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - k) * dist}px)`;
}
function pop(el, t, at, dist = 60, dur = 0.35) {   // 통통 튀며 등장 (브이로그 톤)
  if (t < at) { el.style.opacity = 0; return; }
  const k = prog(t, at, dur);
  el.style.opacity = clamp(k * 3);
  el.style.transform = `translateY(${(1 - easeOutBack(k)) * dist}px)`;
}
function hide(el) { el.style.opacity = 0; }

// ── 탭 지옥: 오프스크린 캔버스에 한 번 그려두고 줌/파편에 재사용
const src = document.createElement('canvas');
src.width = 1920; src.height = 1080;
(function drawHell() {
  const c = src.getContext('2d');
  const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];
  c.fillStyle = '#2b2f36'; c.fillRect(0, 0, 1920, 1080);   // 바탕화면
  function win(x, y, w, h, seed, popups) {
    c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 40;
    c.fillStyle = '#ffffff'; c.beginPath(); c.roundRect(x, y, w, h, 12); c.fill();
    c.shadowBlur = 0;
    // 탭 줄: 탭이 너무 많아 제목이 안 보이고 아이콘만 다닥다닥
    c.fillStyle = '#c9ced6'; c.beginPath(); c.roundRect(x, y, w, 50, [12, 12, 0, 0]); c.fill();
    const n = Math.floor((w - 20) / 27);
    for (let i = 0; i < n; i++) {
      const tx = x + 10 + i * 27;
      c.fillStyle = i === Math.floor(n * 0.45) ? '#ffffff' : '#d9dee5';
      c.beginPath(); c.roundRect(tx, y + 8, 25, 42, [7, 7, 0, 0]); c.fill();
      c.fillStyle = colors[Math.floor(rnd(i, seed) * colors.length)];
      c.beginPath(); c.arc(tx + 12.5, y + 29, 7, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = '#f4f6f8'; c.fillRect(x, y + 50, w, 52);
    c.fillStyle = '#ffffff'; c.beginPath(); c.roundRect(x + 120, y + 60, w - 240, 32, 16); c.fill();
    c.fillStyle = '#eef1f4'; c.fillRect(x, y + 102, w, 28);
    for (let i = 0; i < (w - 30) / 70; i++) { c.fillStyle = '#c3c9d1'; c.fillRect(x + 14 + i * 70, y + 110, 52, 12); }
    for (let i = 0; i < 26; i++) {
      c.fillStyle = `hsl(210, 10%, ${78 + rnd(i, seed + 4) * 14}%)`;
      c.fillRect(x + 30 + rnd(i, seed + 5) * (w - 300), y + 150 + rnd(i, seed + 6) * (h - 240), 100 + rnd(i, seed + 7) * 240, 12 + rnd(i, seed + 8) * 70);
    }
    popups.forEach(([px, py, pw, ph], i) => {
      c.shadowColor = 'rgba(0,0,0,0.3)'; c.shadowBlur = 24;
      c.fillStyle = '#ffffff'; c.beginPath(); c.roundRect(x + px, y + py, pw, ph, 12); c.fill();
      c.shadowBlur = 0;
      c.fillStyle = (i + seed) % 2 ? '#e74c3c' : '#3498db'; c.fillRect(x + px, y + py, pw, 38);
      c.fillStyle = '#ccd2d9';
      for (let k = 0; k < 3; k++) c.fillRect(x + px + 20, y + py + 60 + k * 30, pw * (0.5 + rnd(i, k + seed) * 0.4), 12);
    });
  }
  win(40, 40, 1180, 700, 1, [[700, 300, 400, 220]]);
  win(700, 120, 1180, 700, 2, [[80, 380, 420, 240]]);
  win(330, 300, 1260, 740, 3, [[60, 250, 460, 250], [700, 380, 470, 260], [380, 520, 420, 190]]);
  // 오른쪽 아래 알림이 계속 쌓임
  for (let i = 0; i < 4; i++) {
    c.fillStyle = '#ffffff'; c.beginPath(); c.roundRect(1540, 700 + i * 90, 350, 78, 12); c.fill();
    c.fillStyle = colors[i]; c.beginPath(); c.arc(1580, 739 + i * 90, 18, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#c3c9d1'; c.fillRect(1612, 722 + i * 90, 220, 12); c.fillRect(1612, 746 + i * 90, 150, 12);
  }
})();

const hell = $('#hell');
const hctx = hell.getContext('2d');
const ORIGIN = [960, 330];  // 줌 기준점 = 커서 위치(맨 앞 창의 탭 줄)
const zoomAt = (t) => 1 + 1.4 * easeIn(prog(t, 0, T.crack));
function drawZoomed(ctx, z) {
  ctx.setTransform(z, 0, 0, z, ORIGIN[0] * (1 - z), ORIGIN[1] * (1 - z));
  ctx.drawImage(src, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
// 유리 파편: 지터된 격자를 삼각형으로 분할
const SHARDS = [];
(function buildShards() {
  const cols = 12, rows = 7, P = [];
  for (let y = 0; y <= rows; y++) for (let x = 0; x <= cols; x++) {
    const edge = x === 0 || y === 0 || x === cols || y === rows;
    P.push([x * 160 + (edge ? 0 : (rnd(x, y) - 0.5) * 110), y * 154.3 + (edge ? 0 : (rnd(y, x + 9) - 0.5) * 100)]);
  }
  const at = (x, y) => P[y * (cols + 1) + x];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const a = at(x, y), b = at(x + 1, y), c = at(x + 1, y + 1), d = at(x, y + 1);
    for (const tri of (rnd(x, y + 3) > 0.5 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]])) {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      const dx = cx - 960, dy = cy - 540, len = Math.hypot(dx, dy) || 1;
      const sp = 1400 + rnd(cx, cy) * 2000;
      SHARDS.push({ tri, cx, cy, vx: dx / len * sp, vy: dy / len * sp - 300, rot: (rnd(cy, cx) - 0.5) * 9 });
    }
  }
})();
function drawHell(t) {
  hctx.clearRect(0, 0, 1920, 1080);
  if (t < T.fly) {
    drawZoomed(hctx, zoomAt(t));
    if (t >= T.crack) {   // 금 간 순간: 파편 경계선이 하얗게 번쩍
      hctx.strokeStyle = 'rgba(255,255,255,0.9)'; hctx.lineWidth = 3;
      for (const s of SHARDS) { hctx.beginPath(); s.tri.forEach(([x, y], i) => (i ? hctx.lineTo(x, y) : hctx.moveTo(x, y))); hctx.closePath(); hctx.stroke(); }
    }
    return;
  }
  const dt = t - T.fly, z = zoomAt(T.crack);
  for (const s of SHARDS) {
    hctx.save();
    hctx.globalAlpha = clamp(1 - dt / 0.5);
    hctx.translate(s.cx + s.vx * dt, s.cy + s.vy * dt + 1400 * dt * dt);
    hctx.rotate(s.rot * dt);
    hctx.scale(1 + dt * 0.6, 1 + dt * 0.6);
    hctx.translate(-s.cx, -s.cy);
    hctx.beginPath(); s.tri.forEach(([x, y], i) => (i ? hctx.lineTo(x, y) : hctx.moveTo(x, y))); hctx.closePath();
    hctx.clip();
    drawZoomed(hctx, z);
    hctx.restore();
  }
}

// ── 몽타주 창
const TASKS = ['최저가 검색', '항공권 예약', '메일 답장', '회의 일정 잡기', '문서 요약', '번역', '장바구니 담기', '뉴스 정리',
               '표 만들기', '맛집 예약', '리뷰 분석', '양식 작성', '자료 조사', '영상 요약', '가격 비교', '블로그 초안'];
const CURSOR = '<svg class="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>';
const wall = $('#wall');
const order = TASKS.map((_, i) => i).sort((a, b) => rnd(a, 3) - rnd(b, 3));
TASKS.forEach((task, i) => {
  const w = document.createElement('div');
  w.className = 'win';
  const sk = [0, 1, 2].map((k) => `<div class="sk" style="top:${120 + k * 26}px;width:${180 + rnd(i, k) * 220}px"></div>`).join('');
  w.innerHTML = `<div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url">자동 실행 중...</div></div>
    <div class="task">${task}</div>${sk}<div class="prog"><i></i></div><div class="st">실행 중</div>${CURSOR}`;
  w.dataset.at = T.s2[0] + 0.04 + order.indexOf(i) * 0.055;
  w.dataset.len = 0.55 + rnd(i, 9) * 0.9;
  wall.appendChild(w);
});

// ── 필름 노이즈(프레임마다 고정된 난수)
const gctx = $('#grain').getContext('2d');
const gimg = gctx.createImageData(384, 216);
function grain(frame) {
  let s = (frame * 2654435761) >>> 0;
  for (let i = 0; i < gimg.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const v = s >>> 24;
    gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v;
    gimg.data[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

function render(t) {
  const frame = Math.round(t * 30);
  for (const id of ['s0', 's1', 's2', 's3', 's4', 's5', 's6']) $('#' + id).style.visibility = inRange(t, T[id]) ? 'visible' : 'hidden';

  // 0. 탭 지옥: 극단적 줌인 + 갈 곳 잃고 떨리는 커서 → 박살
  if (inRange(t, T.s0)) drawHell(t);
  const cur = $('#s0 .cur');
  const tremble = 2 + 10 * prog(t, 0, T.crack);
  cur.style.display = t < T.fly ? 'block' : 'none';
  cur.style.left = ORIGIN[0] - 4 + (rnd(frame, 1) - 0.5) * tremble + 'px';
  cur.style.top = ORIGIN[1] + 10 + (rnd(frame, 2) - 0.5) * tremble + 'px';
  const cap = $('#cap');
  cap.style.visibility = inRange(t, T.cap) ? 'visible' : 'hidden';
  rise(cap, t, T.cap[0], 30, 0.2);

  // 1. Aside 등장 + 미쳤습니다
  const s1logo = $('#s1 .logo');
  s1logo.style.transform = `scale(${1.15 - 0.15 * easeOut(prog(t, T.crack, 0.6))})`;
  s1logo.style.opacity = t < T.crazy ? 1 : 0.35;
  s1logo.style.filter = `invert(1) blur(${t < T.crazy ? 0 : 6}px)`;
  slam($('#s1 .l2'), t, T.crazy, 3.2);

  // 2. 몽타주
  const wk = prog(t, T.s2[0], T.s2[1] - T.s2[0]);
  wall.style.transform = `perspective(1600px) rotateX(16deg) rotateZ(-7deg) scale(${1.05 + 0.18 * wk})`;
  $$('.win').forEach((w, i) => {
    const at = +w.dataset.at, len = +w.dataset.len;
    const k = prog(t, at, 0.12);
    w.style.opacity = k;
    w.style.transform = `scale(${1.25 - 0.25 * easeOut(k)})`;
    const p = prog(t, at + 0.1, len);
    $('.prog i', w).style.width = `${p * 100}%`;
    const done = p >= 1;
    w.classList.toggle('done', done);
    $('.st', w).textContent = done ? '완료 ✓' : '실행 중';
    $('.url', w).textContent = done ? '작업 완료' : '자동 실행 중...';
    const c = $('.cur', w);
    c.style.left = 60 + 330 * (0.5 + 0.5 * Math.sin(t * (2.1 + rnd(i, 1)) + i)) + 'px';
    c.style.top = 90 + 110 * (0.5 + 0.5 * Math.sin(t * (2.7 + rnd(i, 2)) + i * 2)) + 'px';
  });
  rise($('#s2 .a'), t, T.s2[0] + 0.12);
  slam($('#s2 .b'), t, T.s2B, 2.4);
  if (t >= T.s2C) { hide($('#s2 .a')); hide($('#s2 .b')); }
  slam($('#s2 .c'), t, T.s2C, 2.2);

  // 3. 숫자 카운트
  $('#floor').style.transform = `perspective(900px) rotateX(62deg) translateY(${(t * 240) % 120}px)`;
  rise($('#s3 .top'), t, T.s3[0] + 0.05);
  $$('#s3 .num').forEach((el, i) => {
    const next = T.nums[i + 1] ?? Infinity;
    if (t < T.nums[i] || t >= next) { hide(el); return; }
    if (i < 3) { slam(el, t, T.nums[i], 1.6, 0.12); return; }
    const k = easeOut(prog(t, T.nums[i], 0.28));   // 4 는 오른쪽에서 쓱
    el.style.opacity = k;
    el.style.transform = `translateX(${(1 - k) * 420}px)`;
  });
  rise($('#s3 .bottom'), t, T.s3Bottom);

  // 4. 충격적입니다: 점점 어두워지며 조여오다가 터짐
  const before = t < T.shock;
  $('#s4').style.transform = `scale(${before ? 1 + 0.12 * easeIn(prog(t, T.s4[0], T.shock - T.s4[0])) : 1})`;
  if (before) {
    rise($('#s4 .m1'), t, T.s4[0] + 0.05, 30, 0.4);
    rise($('#s4 .m2'), t, T.s4M2, 30, 0.2);
  } else { hide($('#s4 .m1')); hide($('#s4 .m2')); }
  slam($('#s4 .shock'), t, T.shock, 3.6, 0.22);
  $('#pulse').style.opacity = before ? prog(t, T.s4[0], T.shock - T.s4[0]) : 0.35;

  // 5. 4분할 (끼익 구간에선 멈춘 화면 유지)
  const t5 = Math.min(t, T.freeze[0]);
  $$('#s5 .col').forEach((el, i) => {
    if (t5 < T.cols[i]) { el.style.transform = `translateY(${i % 2 ? 1100 : -1100}px)`; return; }
    const k = easeOutBack(prog(t5, T.cols[i], 0.22));
    el.style.transform = `translateY(${(1 - k) * (i % 2 ? 1100 : -1100)}px)`;
  });
  $('#s5 .q').style.transform = `scale(${1 + 0.04 * Math.pow(Math.sin(t5 * 4), 8)})`;
  rise($('#s5 .warn'), t5, T.warn, 20, 0.3);
  const fz = prog(t, T.freeze[0], 0.25);
  $('#s5').style.filter = inRange(t, T.freeze) ? `grayscale(${fz}) brightness(${1 - 0.3 * fz})` : '';
  $('#s5').style.transform = inRange(t, T.freeze) ? `scale(${1 - 0.05 * easeOut(fz)}) rotate(${-1.5 * easeOut(fz)}deg)` : '';

  // 6. 텐션 다운
  pop($('#s6 .v1'), t, T.v1);
  pop($('#s6 .v2'), t, T.v2);
  pop($('#s6 .v3'), t, T.v3);
  $('#s6 .mk').style.backgroundSize = `${easeOut(prog(t, T.v3 + 0.15, 0.35)) * 100}% 38%`;

  // 카메라: 흔들림 + 펀치 줌
  let sx = 0, sy = 0;
  for (const [at, amp, dur] of SHAKE) {
    const a = amp * decay(t, at, dur);
    sx += a * Math.sin(t * 97.3 + at) * Math.cos(t * 41.1);
    sy += a * Math.sin(t * 73.7 + at * 3);
  }
  const punch = PUNCH.reduce((s, [at, p]) => s + p * decay(t, at, 0.35), 0);
  $('#stage').style.transform = `translate(${sx}px, ${sy}px) scale(${1 + punch})`;

  $('#flash').style.opacity = FLASH.reduce((m, [at, a]) => Math.max(m, a * decay(t, at, 0.14)), 0);
  const vlog = inRange(t, T.s6);
  $('#grain').style.opacity = vlog ? 0.05 : 0.09;
  $('#grain').style.mixBlendMode = vlog ? 'multiply' : 'screen';
  $('#vig').style.opacity = vlog ? 0.25 : 1;
  grain(frame);
}

window.render = render;
window.DURATION = T.end;

// 브라우저에서 열면 그냥 재생(미리보기). 렌더 시에는 ?render 로 열어 프레임 단위로 그림.
if (!location.search.includes('render')) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = (now) => { render(((now - t0) / 1000) % T.end); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else {
  render(0);
}
</script>
</body>
</html>
