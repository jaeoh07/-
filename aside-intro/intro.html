<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Aside Intro</title>
<link rel="stylesheet" href="fonts/nanum-gothic-800.css">
<link rel="stylesheet" href="fonts/black-han-sans.css">
<style>
  :root {
    --red: #FF1E2D;
    --white: #FFFFFF;
    --bg: #050505;
    --green: #2EE59D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; color: var(--white); }
  .bh { font-family: 'Black Han Sans', sans-serif; font-weight: 400; }
  .red { color: var(--red); }

  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; letter-spacing: -0.02em; opacity: 0; }
  .logo { position: absolute; left: 50%; background: url(aside.png) center / contain no-repeat; filter: invert(1); mix-blend-mode: lighten; }

  /* 1. 훅: 이 브라우저는 미쳤습니다 */
  #s1 .logo { width: 760px; height: 400px; top: 70px; margin-left: -380px; }
  #s1 .l1 { top: 470px; font-size: 92px; }
  #s1 .l2 { top: 560px; font-size: 330px; line-height: 1.1; }

  /* 2. 몽타주: 인터넷에서 하는 모든 일, 전부 대신 해줍니다 */
  #wall { position: absolute; left: 50%; top: 50%; width: 1912px; height: 1112px; margin: -556px 0 0 -956px;
          display: grid; grid-template-columns: repeat(4, 460px); grid-auto-rows: 260px; gap: 24px; }
  .win { background: #121316; border: 2px solid #26282d; border-radius: 16px; overflow: hidden; position: relative; opacity: 0; }
  .win.done { border-color: var(--green); box-shadow: 0 0 24px rgba(46, 229, 157, 0.35); }
  .win .bar { height: 40px; background: #1b1d21; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .win .dot { width: 12px; height: 12px; border-radius: 6px; background: #3a3d44; }
  .win .url { margin-left: 10px; flex: 1; height: 24px; border-radius: 12px; background: #0c0d0f; font-size: 15px; line-height: 24px; padding: 0 12px; color: #9aa0a8; }
  .win .task { position: absolute; left: 22px; top: 62px; font-size: 34px; }
  .win .sk { position: absolute; left: 22px; height: 12px; border-radius: 6px; background: #24272c; }
  .win .prog { position: absolute; left: 22px; right: 22px; bottom: 54px; height: 10px; border-radius: 5px; background: #24272c; overflow: hidden; }
  .win .prog i { display: block; height: 100%; width: 0; background: var(--red); }
  .win.done .prog i { background: var(--green); }
  .win .st { position: absolute; left: 22px; bottom: 16px; font-size: 22px; color: #9aa0a8; }
  .win.done .st { color: var(--green); }
  .win .cur { position: absolute; width: 34px; height: 34px; }
  #s2 .band { position: absolute; left: 0; right: 0; top: 300px; height: 500px;
              background: linear-gradient(transparent, rgba(0,0,0,0.88) 22%, rgba(0,0,0,0.88) 78%, transparent); }
  #s2 .a { top: 345px; font-size: 88px; }
  #s2 .b { top: 445px; font-size: 270px; line-height: 1.1; }
  #s2 .c { top: 420px; font-size: 200px; line-height: 1.2; }
  #s2 .hl { background: var(--red); padding: 0 24px; border-radius: 12px; }

  /* 3. 이 브라우저한테 총 4가지 일을 시킬 건데요 */
  #floor { position: absolute; left: -50%; right: -50%; top: 540px; height: 1400px; transform-origin: top;
           background-image: linear-gradient(rgba(255,30,45,0.35) 2px, transparent 2px), linear-gradient(90deg, rgba(255,30,45,0.35) 2px, transparent 2px);
           background-size: 120px 120px; }
  #s3 .top { top: 90px; font-size: 86px; }
  #s3 .num { top: 150px; font-size: 640px; line-height: 1.05; }
  #s3 .num.four { text-shadow: 0 0 80px rgba(255,30,45,0.6); }
  #s3 .bottom { top: 880px; font-size: 100px; }

  /* 4. 마지막은 진짜 충격적입니다 */
  #s4 .m1 { top: 330px; font-size: 110px; }
  #s4 .m2 { top: 470px; font-size: 230px; line-height: 1.1; }
  #s4 .shock { top: 360px; font-size: 300px; line-height: 1.1; }
  #pulse { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(255,0,20,0.75) 100%); opacity: 0; }

  /* 5. 세로 4분할: 1~4단계 (slot 칸에 직접 영상/글을 넣으면 됨) */
  #s5 .col { position: absolute; top: 0; width: 480px; height: 1080px; background: #0a0a0b; }
  #s5 .lab { position: absolute; top: 50px; left: 0; right: 0; text-align: center; font-size: 120px; line-height: 1.1; }
  #s5 .slot { position: absolute; top: 230px; left: 30px; right: 30px; bottom: 130px; border-radius: 20px;
              border: 3px solid rgba(255,255,255,0.12); background: #111214; }
  #s5 .col.last .lab { color: var(--red); }
  #s5 .col.last .slot { border-color: var(--red); background: #160608; box-shadow: inset 0 0 80px rgba(255,30,45,0.25); }
  #s5 .q { position: absolute; left: 0; right: 0; top: 50%; margin-top: -150px; text-align: center; font-size: 250px; line-height: 1.2; color: var(--red); }
  #s5 .warn { position: absolute; bottom: 45px; left: 0; right: 0; text-align: center; font-size: 46px; opacity: 0; }
  #s5 .vline { position: absolute; top: 0; width: 5px; height: 1080px; background: #2a2b2f; }

  /* 6. 엔딩 로고 */
  #s6 .logo { width: 1000px; height: 520px; top: 280px; margin-left: -500px; }

  /* 오버레이 */
  #glitch { position: absolute; inset: 0; pointer-events: none; }
  #glitch div { position: absolute; left: 0; width: 100%; mix-blend-mode: difference; display: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.09; mix-blend-mode: screen; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1">
    <div class="logo"></div>
    <div class="line l1">이 브라우저는</div>
    <div class="line l2 bh red">미쳤습니다</div>
  </div>

  <div class="scene" id="s2">
    <div id="wall"></div>
    <div class="band"></div>
    <div class="line a">인터넷에서 하는</div>
    <div class="line b bh">모든 일</div>
    <div class="line c bh">전부 <span class="hl">대신</span> 해줍니다</div>
  </div>

  <div class="scene" id="s3">
    <div id="floor"></div>
    <div class="line top">이 브라우저한테</div>
    <div class="line num bh">1</div>
    <div class="line num bh">2</div>
    <div class="line num bh">3</div>
    <div class="line num bh red four">4</div>
    <div class="line bottom">총 <span class="red">4가지</span> 일을 시킬 건데요</div>
  </div>

  <div class="scene" id="s4">
    <div id="pulse"></div>
    <div class="line m1">마지막은</div>
    <div class="line m2 bh">진짜</div>
    <div class="line shock bh red">충격적입니다</div>
  </div>

  <div class="scene" id="s5">
    <div class="col" style="left: 0"><div class="lab bh">1단계</div><div class="slot"></div></div>
    <div class="col" style="left: 480px"><div class="lab bh">2단계</div><div class="slot"></div></div>
    <div class="col" style="left: 960px"><div class="lab bh">3단계</div><div class="slot"></div></div>
    <div class="col last" style="left: 1440px"><div class="lab bh">4단계</div><div class="slot"><div class="q bh">???</div></div><div class="warn">끝까지 보세요</div></div>
    <div class="vline" style="left: 478px"></div>
    <div class="vline" style="left: 958px"></div>
    <div class="vline" style="left: 1438px"></div>
  </div>

  <div class="scene" id="s6">
    <div class="logo"></div>
  </div>
</div>
<div id="glitch"></div>
<div id="flash"></div>
<canvas id="grain" width="384" height="216"></canvas>
<div id="vig"></div>

<script>
// 타임라인(초). 녹음에 맞춰 숫자만 바꾸면 됩니다. sfx.py 의 T 도 같이 맞추세요.
const T = {
  s1: [0.0, 1.7],   s1L1: 0.12, s1Crazy: 0.6,
  s2: [1.7, 4.4],   s2B: 2.15, s2C: 3.0,
  s3: [4.4, 6.4],   nums: [4.72, 4.92, 5.12, 5.32], s3Bottom: 5.6,
  s4: [6.4, 8.7],   s4M2: 6.9, s4Shock: 7.5, beats: [6.6, 6.85, 7.08, 7.28],
  s5: [8.7, 11.45], cols: [8.75, 9.12, 9.45, 9.78], warn: 10.5,
  s6: [11.45, 12.0],
  end: 12.0,
};
const GLITCH = [[0.0, 0.28, 1], [1.62, 1.76, 0.8], [4.33, 4.44, 0.7], [7.5, 7.78, 1], [9.78, 9.96, 0.9], [11.36, 11.52, 1]];
const FLASH = [[T.s1Crazy, 0.9], [T.s2B, 0.5], [T.s2C, 0.5], [T.nums[3], 0.7], [T.s4Shock, 1], [T.cols[3], 0.6], [T.s6[0] + 0.08, 0.6]];
const SHAKE = [[T.s1Crazy, 34, 0.5], [T.s2B, 18, 0.3], [T.s2C, 22, 0.35], [T.nums[3], 30, 0.45], [T.s4Shock, 52, 0.8],
               [T.cols[0], 10, 0.25], [T.cols[1], 14, 0.25], [T.cols[2], 18, 0.25], [T.cols[3], 34, 0.5]];
const PUNCH = [[T.s1Crazy, 0.08], [T.s2C, 0.05], [T.nums[3], 0.07], [T.s4Shock, 0.1], [T.cols[3], 0.04]];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeOutBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const inRange = (t, [a, b]) => t >= a && t < b;
const decay = (t, at, dur) => (t < at || t > at + dur ? 0 : Math.pow(1 - (t - at) / dur, 2));

// 크게 시작해서 쾅 박히는 등장
function slam(el, t, at, from = 2.6, dur = 0.2) {
  if (t < at) { el.style.opacity = 0; return; }
  const k = prog(t, at, dur);
  el.style.opacity = clamp(k * 4);
  el.style.transform = `scale(${from + (1 - from) * easeOut(k)})`;
}
function rise(el, t, at, dist = 50, dur = 0.25) {
  if (t < at) { el.style.opacity = 0; return; }
  const k = easeOut(prog(t, at, dur));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - k) * dist}px)`;
}
function hide(el) { el.style.opacity = 0; }
// RGB 분리(색수차)
function rgb(el, d) {
  el.style.textShadow = d < 0.5 ? '' : `${-d}px 0 rgba(255,0,64,0.9), ${d}px 0 rgba(0,240,255,0.9)`;
}
function glitchAmt(t) {
  let g = 0;
  for (const [a, b, s] of GLITCH) if (t >= a && t < b) g = Math.max(g, s);
  return g;
}

// 몽타주 창 만들기
const TASKS = ['최저가 검색', '항공권 예약', '메일 답장', '회의 일정 잡기', '문서 요약', '번역', '장바구니 담기', '뉴스 정리',
               '표 만들기', '맛집 예약', '리뷰 분석', '양식 작성', '자료 조사', '영상 요약', '가격 비교', '블로그 초안'];
const CURSOR = '<svg class="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>';
const wall = $('#wall');
const order = TASKS.map((_, i) => i).sort((a, b) => rnd(a, 3) - rnd(b, 3));
TASKS.forEach((task, i) => {
  const w = document.createElement('div');
  w.className = 'win';
  const sk = [0, 1, 2].map((k) => `<div class="sk" style="top:${120 + k * 26}px;width:${180 + rnd(i, k) * 220}px"></div>`).join('');
  w.innerHTML = `<div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url">자동 실행 중...</div></div>
    <div class="task">${task}</div>${sk}<div class="prog"><i></i></div><div class="st">실행 중</div>${CURSOR}`;
  w.dataset.at = T.s2[0] + 0.04 + order.indexOf(i) * 0.055;
  w.dataset.len = 0.55 + rnd(i, 9) * 0.9;
  wall.appendChild(w);
});

// 필름 노이즈(프레임마다 고정된 난수)
const gctx = $('#grain').getContext('2d');
const gimg = gctx.createImageData(384, 216);
function grain(frame) {
  let s = (frame * 2654435761) >>> 0;
  for (let i = 0; i < gimg.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const v = s >>> 24;
    gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v;
    gimg.data[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

// 글리치 막대
const gl = $('#glitch');
for (let i = 0; i < 10; i++) gl.appendChild(document.createElement('div'));

function render(t) {
  const frame = Math.round(t * 30);
  for (const id of ['s1', 's2', 's3', 's4', 's5', 's6']) $('#' + id).style.visibility = inRange(t, T[id]) ? 'visible' : 'hidden';

  // 1. 훅
  const s1logo = $('#s1 .logo');
  s1logo.style.transform = `scale(${1 + 0.1 * prog(t, 0, T.s1[1])})`;
  s1logo.style.opacity = t < T.s1Crazy ? 1 : 0.35;
  s1logo.style.filter = `invert(1) blur(${t < T.s1Crazy ? 0 : 6}px)`;
  rise($('#s1 .l1'), t, T.s1L1);
  slam($('#s1 .l2'), t, T.s1Crazy, 3.2);
  rgb($('#s1 .l2'), 14 * decay(t, T.s1Crazy, 0.4) + 3);

  // 2. 몽타주
  const wk = prog(t, T.s2[0], T.s2[1] - T.s2[0]);
  wall.style.transform = `perspective(1600px) rotateX(16deg) rotateZ(-7deg) scale(${1.05 + 0.18 * wk})`;
  $$('.win').forEach((w, i) => {
    const at = +w.dataset.at, len = +w.dataset.len;
    const k = prog(t, at, 0.12);
    w.style.opacity = k;
    w.style.transform = `scale(${1.25 - 0.25 * easeOut(k)})`;
    const p = prog(t, at + 0.1, len);
    $('.prog i', w).style.width = `${p * 100}%`;
    const done = p >= 1;
    w.classList.toggle('done', done);
    $('.st', w).textContent = done ? '완료 ✓' : '실행 중';
    $('.url', w).textContent = done ? '작업 완료' : '자동 실행 중...';
    const c = $('.cur', w);
    const cx = 60 + 330 * (0.5 + 0.5 * Math.sin(t * (2.1 + rnd(i, 1)) + i));
    const cy = 90 + 110 * (0.5 + 0.5 * Math.sin(t * (2.7 + rnd(i, 2)) + i * 2));
    c.style.left = cx + 'px';
    c.style.top = cy + 'px';
  });
  rise($('#s2 .a'), t, T.s2[0] + 0.12);
  slam($('#s2 .b'), t, T.s2B, 2.4);
  rgb($('#s2 .b'), 10 * decay(t, T.s2B, 0.3));
  if (t >= T.s2C) { hide($('#s2 .a')); hide($('#s2 .b')); }
  slam($('#s2 .c'), t, T.s2C, 2.2);

  // 3. 숫자 카운트
  $('#floor').style.transform = `perspective(900px) rotateX(62deg) translateY(${(t * 240) % 120}px)`;
  rise($('#s3 .top'), t, T.s3[0] + 0.05);
  $$('#s3 .num').forEach((el, i) => {
    const next = T.nums[i + 1] ?? Infinity;
    if (t < T.nums[i] || t >= next) { hide(el); return; }
    slam(el, t, T.nums[i], i === 3 ? 2.2 : 1.6, i === 3 ? 0.2 : 0.12);
  });
  rgb($('#s3 .four'), 16 * decay(t, T.nums[3], 0.4));
  rise($('#s3 .bottom'), t, T.s3Bottom);

  // 4. 충격적입니다
  const before = t < T.s4Shock;
  const s4zoom = before ? 1 + 0.12 * easeIn(prog(t, T.s4[0], T.s4Shock - T.s4[0])) : 1;
  $('#s4 .m1').parentElement.style.transform = `scale(${s4zoom})`;
  if (before) {
    rise($('#s4 .m1'), t, T.s4[0] + 0.05, 30, 0.4);
    rise($('#s4 .m2'), t, T.s4M2, 30, 0.2);
  } else { hide($('#s4 .m1')); hide($('#s4 .m2')); }
  slam($('#s4 .shock'), t, T.s4Shock, 3.6, 0.22);
  const jitter = t > T.s4Shock + 0.3 ? 3 : 0;
  rgb($('#s4 .shock'), 22 * decay(t, T.s4Shock, 0.6) + 4 + jitter * rnd(frame, 5));
  let pulse = T.beats.reduce((m, b) => Math.max(m, decay(t, b, 0.22)), 0);
  if (!before) pulse = 0.5 + 0.15 * Math.sin(t * 9);
  $('#pulse').style.opacity = pulse;

  // 5. 4분할
  $$('#s5 .col').forEach((el, i) => {
    if (t < T.cols[i]) { el.style.transform = `translateY(${i % 2 ? 1100 : -1100}px)`; return; }
    const k = easeOutBack(prog(t, T.cols[i], 0.22));
    el.style.transform = `translateY(${(1 - k) * (i % 2 ? 1100 : -1100)}px)`;
  });
  const q = $('#s5 .q');
  const qg = t > T.cols[3] ? (rnd(frame, 7) > 0.8 ? 1 : 0) : 0;
  q.style.transform = `translateX(${qg * (rnd(frame, 8) - 0.5) * 40}px) scale(${1 + 0.05 * Math.pow(Math.sin(t * 7.5), 8)})`;
  rgb(q, 8 + 18 * qg);
  const warn = $('#s5 .warn');
  warn.style.opacity = t < T.warn ? 0 : (Math.floor((t - T.warn) * 4) % 2 === 0 ? 1 : 0.35);

  // 6. 엔딩 로고
  const lk = prog(t, T.s6[0] + 0.08, 0.3);
  $('#s6 .logo').style.transform = `scale(${1.25 - 0.25 * easeOut(lk)})`;
  $('#s6 .logo').style.opacity = t < T.s6[0] + 0.08 ? 0 : 1;

  // 카메라: 흔들림 + 펀치 줌 + 글리치
  let sx = 0, sy = 0;
  for (const [at, amp, dur] of SHAKE) {
    const a = amp * decay(t, at, dur);
    sx += a * Math.sin(t * 97.3 + at) * Math.cos(t * 41.1);
    sy += a * Math.sin(t * 73.7 + at * 3);
  }
  const punch = PUNCH.reduce((s, [at, p]) => s + p * decay(t, at, 0.35), 0);
  const g = glitchAmt(t);
  const gx = g ? (rnd(frame, 11) - 0.5) * 80 * g : 0;
  const skew = g ? (rnd(frame, 12) - 0.5) * 8 * g : 0;
  const stage = $('#stage');
  stage.style.transform = `translate(${sx + gx}px, ${sy}px) scale(${1 + punch}) skewX(${skew}deg)`;
  stage.style.filter = g ? `contrast(${1 + 0.6 * g}) hue-rotate(${(rnd(frame, 13) - 0.5) * 90 * g}deg)` : '';

  $$('#glitch div').forEach((d, i) => {
    if (!g || rnd(frame, i + 20) < 0.35) { d.style.display = 'none'; return; }
    d.style.display = 'block';
    d.style.top = rnd(frame, i + 40) * 1080 + 'px';
    d.style.height = 4 + rnd(frame, i + 60) * 70 + 'px';
    d.style.left = (rnd(frame, i + 80) - 0.5) * 200 + 'px';
    d.style.background = ['#ff1e2d', '#00f0ff', '#ffffff'][i % 3];
  });

  $('#flash').style.opacity = FLASH.reduce((m, [at, a]) => Math.max(m, a * decay(t, at, 0.14)), 0);
  grain(frame);
}

window.render = render;
window.DURATION = T.end;

// 브라우저에서 열면 그냥 재생(미리보기). 렌더 시에는 ?render 로 열어 프레임 단위로 그림.
if (!location.search.includes('render')) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = (now) => { render(((now - t0) / 1000) % T.end); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else {
  render(0);
}
</script>
</body>
</html>
